<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Face Balance · 분석 시작</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
:root{
  --bg0:#04050d;--bg1:#080b1c;--cyan:#3ce8ff;--cyan-dim:rgba(60,232,255,.6);
  --mag:#ff4fd8;--vio:#9b6cff;--lime:#7CFFB2;
  --ink:#eef4ff;--ink2:rgba(238,244,255,.66);--ink3:rgba(238,244,255,.36);
  --line:rgba(140,180,255,.14);
  --mono:'JetBrains Mono',monospace;--disp:'Space Grotesk','Pretendard',sans-serif;--kr:'Pretendard',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;font-family:var(--kr);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;
  background:radial-gradient(1200px 600px at 50% -10%, rgba(155,108,255,.10), transparent 60%),
    radial-gradient(900px 500px at 0% 40%, rgba(60,232,255,.05), transparent 55%),#05060f}
.phone{position:relative;width:430px;height:900px;border-radius:44px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 24%, #0a1024 0%, #070b1a 68%, #05070f 100%);
  box-shadow:0 0 0 1px rgba(120,160,255,.10),0 40px 120px -20px rgba(60,40,120,.55)}
.phone::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 14%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.2px 1.2px at 82% 10%, rgba(180,220,255,.5), transparent),
    radial-gradient(1px 1px at 28% 30%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.3px 1.3px at 70% 22%, rgba(200,180,255,.4), transparent),
    radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,.35), transparent),
    radial-gradient(1.1px 1.1px at 18% 44%, rgba(160,230,255,.4), transparent)}
.hud-frame{position:absolute;inset:14px;z-index:6;pointer-events:none}
.hud-frame span{position:absolute;width:22px;height:22px;border:1.5px solid rgba(60,232,255,.30)}
.hud-frame .tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:6px}
.hud-frame .tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:6px}
.hud-frame .bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:6px}
.hud-frame .br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:6px}

.screen{position:relative;z-index:3;height:100%;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 30px 0;
  font-family:var(--mono);font-size:12px;color:var(--ink2);letter-spacing:.5px;flex:none}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.statusbar .dots i{width:5px;height:5px;border-radius:50%;background:var(--cyan-dim);display:block}

/* header */
.head{flex:none;text-align:center;padding:18px 30px 4px}
.head h1{font-family:var(--disp);font-weight:600;font-size:23px;letter-spacing:-.4px;color:#fff}
.head p{font-size:13.5px;color:var(--ink2);margin-top:8px}

/* face stage */
.stage{flex:1 1 auto;position:relative;min-height:0}
#faceCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#faceCanvas:active{cursor:grabbing}
.stage::after{content:"좌우로 드래그하여 회전";position:absolute;left:0;right:0;bottom:6px;text-align:center;
  font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;color:var(--ink3);text-transform:uppercase;pointer-events:none}
.glow{position:absolute;left:50%;top:46%;width:300px;height:300px;transform:translate(-50%,-50%);pointer-events:none;z-index:-1;
  background:radial-gradient(circle, rgba(60,232,255,.12), transparent 62%)}

/* guide cards */
.guides{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 12px}
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:14px 6px 12px;border-radius:15px;
  background:linear-gradient(180deg,rgba(150,180,255,.055),rgba(120,150,255,.015));
  border:1px solid var(--line);backdrop-filter:blur(10px)}
.gcard svg{width:30px;height:30px;flex:none}
.gcard p{font-size:10px;line-height:1.42;color:var(--ink2);text-align:center;word-break:keep-all}
.ic-cyan{color:var(--cyan)}
.ic-vio{color:var(--vio)}

/* privacy */
.privacy{flex:none;margin:0 16px 14px;display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:16px;
  background:linear-gradient(180deg,rgba(155,108,255,.07),rgba(60,232,255,.025));
  border:1px solid rgba(120,150,255,.16);backdrop-filter:blur(10px)}
.privacy .shield{width:30px;height:34px;flex:none;color:var(--cyan)}
.privacy p{font-size:12.5px;line-height:1.55;color:var(--ink2)}
.grad{background:linear-gradient(90deg,var(--cyan),var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}

/* CTA */
.cta{flex:none;padding:4px 22px 26px}
.startbtn{width:100%;height:60px;border:none;border-radius:18px;cursor:pointer;position:relative;overflow:hidden;
  font-family:var(--kr);font-size:16px;font-weight:600;color:#04060f;
  display:flex;align-items:center;justify-content:center;gap:11px;
  background:linear-gradient(135deg,var(--cyan),var(--vio));
  box-shadow:0 0 40px -8px rgba(60,232,255,.55), inset 0 1px 0 rgba(255,255,255,.4);transition:transform .12s}
.startbtn:active{transform:scale(.985)}
.startbtn .scan{width:20px;height:20px}
.startbtn .arr{width:19px;height:19px;margin-left:2px}
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Face Balance">
<meta name="theme-color" content="#05060f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>
@media (max-width:520px){
 body{padding:0!important;display:block!important}
 .phone{width:100%!important;border-radius:0!important;box-shadow:none!important;min-height:100dvh}
 .statusbar{padding-top:max(16px,env(safe-area-inset-top))!important}
}
</style>
</head>
<body>
<div class="phone">
  <div class="hud-frame"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>

  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <span class="dots"><i></i><i></i><i style="background:var(--vio)"></i> READY</span>
    </div>

    <div class="head">
      <h1>분석을 시작할 준비가 되었나요?</h1>
      <p>아래 가이드를 따라 얼굴을 준비해 주세요.</p>
    </div>

    <div class="stage">
      <div class="glow"></div>
      <canvas id="faceCanvas"></canvas>
    </div>

    <div class="guides">
      <div class="gcard">
        <svg class="ic-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        <p>밝은 조명 아래에서 사용해주세요.</p>
      </div>
      <div class="gcard">
        <svg class="ic-vio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="15" r="3"/><circle cx="17" cy="15" r="3"/><path d="M10 14.5h4M3 13l2-1M21 13l-2-1M5 9l4-3 6 0 4 3"/><path d="M3 3l18 18" stroke-width="1.7"/></svg>
        <p>모자, 안경, 마스크를 벗고 측정해주세요.</p>
      </div>
      <div class="gcard">
        <svg class="ic-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3.3 0-5.5 2.4-5.5 6 0 2.1.8 4 2 5.2-2.4 1-4.5 2.7-4.5 4.8M12 3c3.3 0 5.5 2.4 5.5 6 0 2.1-.8 4-2 5.2 2.4 1 4.5 2.7 4.5 4.8"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>
        <p>카메라를 정면으로 바라봐주세요.</p>
      </div>
      <div class="gcard">
        <svg class="ic-vio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M6 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M3 3l18 18" stroke-width="1.7"/></svg>
        <p>스캔 동안 움직이지 마세요.</p>
      </div>
    </div>

    <div class="privacy">
      <svg class="shield" viewBox="0 0 24 26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1.5 3 5v7c0 6 4 9.5 9 11.5 5-2 9-5.5 9-11.5V5z"/><rect x="9" y="11" width="6" height="5.4" rx="1.2"/><path d="M10.2 11V9.4a1.8 1.8 0 0 1 3.6 0V11"/></svg>
      <p>얼굴 이미지는 저장되지 않으며,<br><span class="grad">분석 결과 데이터</span>만 기록됩니다.</p>
    </div>

    <div class="cta">
      <button class="startbtn">
        <svg class="scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 1-1 1h-3"/></svg>
        분석 시작하기
        <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="face-mesh.js"></script>
</body>
</html>
